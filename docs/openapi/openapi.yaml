openapi: 3.1.0
info:
  title: CarHub User Module API
  version: 0.0.1-SNAPSHOT
  description: Entry point for the implemented user module API. The authoritative module contract is user.yaml.
servers:
- url: http://localhost:8081/carhub
  description: Local defaults from application.yaml; deployment properties may override host, port and context path.
tags:
- name: Client profile
  description: Profile of the authenticated client.
paths:
  /api/v1/clients/me/personal-info:
    $ref: ./user.yaml#/paths/~1api~1v1~1clients~1me~1personal-info
  /api/v1/clients/me/profile:
    $ref: ./user.yaml#/paths/~1api~1v1~1clients~1me~1profile
components:
  securitySchemes:
    bearerAuth:
      $ref: ./user.yaml#/components/securitySchemes/bearerAuth
  schemas:
    UpdatePersonalInfoRequest:
      $ref: ./user.yaml#/components/schemas/UpdatePersonalInfoRequest
    ClientProfileResponse:
      $ref: ./user.yaml#/components/schemas/ClientProfileResponse
    PersonalInfoResponse:
      $ref: ./user.yaml#/components/schemas/PersonalInfoResponse
    AccountResponse:
      $ref: ./user.yaml#/components/schemas/AccountResponse
    IdentityDocumentResponse:
      $ref: ./user.yaml#/components/schemas/IdentityDocumentResponse
    DriverLicenseResponse:
      $ref: ./user.yaml#/components/schemas/DriverLicenseResponse
    ProfileCompletionResponse:
      $ref: ./user.yaml#/components/schemas/ProfileCompletionResponse
    IdentityDocumentType:
      $ref: ./user.yaml#/components/schemas/IdentityDocumentType
    ProfileSection:
      $ref: ./user.yaml#/components/schemas/ProfileSection
    ApiError:
      $ref: ./user.yaml#/components/schemas/ApiError
    ApiProblem:
      $ref: ./user.yaml#/components/schemas/ApiProblem
    MvcProblemDetail:
      $ref: ./user.yaml#/components/schemas/MvcProblemDetail
    NullableYamlDate:
      $ref: ./user.yaml#/components/schemas/NullableYamlDate
    PersonalInfoYamlResponse:
      $ref: ./user.yaml#/components/schemas/PersonalInfoYamlResponse
    DriverLicenseYamlResponse:
      $ref: ./user.yaml#/components/schemas/DriverLicenseYamlResponse
    ClientProfileYamlResponse:
      $ref: ./user.yaml#/components/schemas/ClientProfileYamlResponse
